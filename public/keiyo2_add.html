<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>駅を追加する（詳細付き）</title>
</head>
<body>
    <form action="/keiyo2_add">
        <label for="code">駅コード</label>
        <input type="text" name="code" id="code" required>

        <label for="name">駅名</label>
        <input type="text" name="name" id="name" required>

        <label for="change">乗り換え線</label>
        <input type="text" name="change" id="change">

        <label for="passengers">乗車人数</label>
        <input type="number" name="passengers" id="passengers" min="0" required>

        <label for="distance">東京駅からの距離(km)</label>
        <input type="number" name="distance" id="distance" min="0" step="0.1" required>

        <input type="submit" value="登録">
    </form>
</body>
</html>
